[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "workflaskcode"
version = "0.1.0"
description = "Terminal AI coding agent. Your code. Your models. Your workflow."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "WorkFlaskCode contributors"}]
keywords = ["ai", "coding-agent", "cli", "terminal", "llm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
]
# The core has zero runtime dependencies (standard library only).
dependencies = []

[project.optional-dependencies]
ui = ["rich>=13", "prompt_toolkit>=3"]
keyring = ["keyring>=24"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
workflaskcode = "workflaskcode.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
